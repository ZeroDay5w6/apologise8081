<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прости меня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FDF0F2;
    --bg-warm: #FBE1D8;
    --ink: #3A1E2E;
    --rose: #C8577A;
    --rose-deep: #A83E60;
    --honey: #E7B570;
    --mauve: #8E7B92;
    --mauve-soft: #F1E9EF;
    --card: #FFFBF9;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: radial-gradient(circle at 30% 20%, var(--bg-warm), var(--bg) 60%);
    font-family: 'Karla', sans-serif;
    color: var(--ink);
    overflow-x: hidden;
    transition: background 1.2s ease;
  }

  body.stage-2{ background: radial-gradient(circle at 30% 20%, #FBD8CF, #FDEDE8 60%); }
  body.stage-3{ background: radial-gradient(circle at 30% 20%, #F8CBC0, #FCE7DF 60%); }
  body.stage-4, body.forgiven{ background: radial-gradient(circle at 30% 20%, #F5C0B3, #FCE2D6 60%); }

  .hearts{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .heart{
    position: absolute;
    bottom: -40px;
    font-size: 18px;
    color: var(--rose);
    opacity: 0.25;
    animation: float 14s linear infinite;
  }

  @keyframes float{
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.3; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  .wrap{
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card{
    max-width: 460px;
    width: 100%;
    text-align: left;
  }

  .polaroid{
    background: #fff;
    padding: 10px 10px 26px 10px;
    border-radius: 4px;
    box-shadow: 0 14px 30px rgba(58, 30, 46, 0.18);
    transform: rotate(-4deg);
    width: 190px;
    margin: 0 0 26px 4px;
  }
  .polaroid img{
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 2px;
  }
  .polaroid span{
    display: block;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--mauve);
    margin-top: 8px;
  }

  .eyebrow-line{
    width: 42px;
    height: 3px;
    background: var(--honey);
    border-radius: 2px;
    margin-bottom: 22px;
  }

  h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 44px;
    line-height: 1.12;
    margin: 0 0 18px 0;
    color: var(--rose-deep);
    letter-spacing: 0.2px;
    transition: opacity 0.35s ease;
  }

  p.body-text{
    font-size: 17px;
    line-height: 1.65;
    color: var(--ink);
    margin: 0 0 34px 0;
    max-width: 42ch;
    transition: opacity 0.35s ease;
  }

  .btn-row{
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }

  button{
    font-family: 'Karla', sans-serif;
    font-size: 16px;
    font-weight: 600;
    border-radius: 999px;
    padding: 14px 30px;
    cursor: pointer;
    border: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }

  button:focus-visible{
    outline: 3px solid var(--honey);
    outline-offset: 2px;
  }

  .btn-yes{
    background: var(--rose);
    color: #fff;
    box-shadow: 0 8px 20px rgba(200, 87, 122, 0.35);
  }
  .btn-yes:hover{ transform: translateY(-2px); box-shadow: 0 12px 24px rgba(200, 87, 122, 0.42); }

  .btn-no{
    background: transparent;
    color: var(--mauve);
    border: 1.5px solid var(--mauve-soft);
  }
  .btn-no:hover{ background: var(--mauve-soft); }

  .stage-count{
    margin-top: 20px;
    font-size: 13px;
    color: var(--mauve);
    opacity: 0.8;
  }

  .fade{
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* Forgiven screen */
  .forgiven-screen{
    display: none;
  }
  body.forgiven .forgiven-screen{ display: block; }
  body.forgiven .apology-screen{ display: none; }

  .forgiven-screen h1{ color: var(--rose-deep); }

  .couple-photo{
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(58, 30, 46, 0.22);
    margin-bottom: 26px;
  }
  .couple-photo img{
    display: block;
    width: 100%;
    height: auto;
  }

  .burst-heart{
    position: fixed;
    font-size: 22px;
    color: var(--rose);
    pointer-events: none;
    z-index: 5;
    animation: burst 1.6s ease-out forwards;
  }
  @keyframes burst{
    0%{ transform: translateY(0) scale(0.6); opacity: 1; }
    100%{ transform: translateY(-160px) scale(1.2); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .heart, .burst-heart{ animation: none; display: none; }
  }
</style>

      <div class="eyebrow-line"></div>
      <h1>Спасибоф</h1>
      <p class="body-text">Ты самая лучшаяф. Обещаю беречь твои чуттва и делать всё, чтобы больше тебя так не расстраивать.</p>
    </div>

  </div>
</div>

<script>
  const stages = [
    {
      title: "Любимка, прости меня",
      body: "Прости, что заставил тебя ждать, и не приехал раньше. Обесценил твоё время и чувства."
    },
    {
      title: "Мне правда очень жаль",
      body: "Прости, что был невнимательным и не услышал, что для тебя было важно. Заставил тебя почувствовать себя одинокой."
    },
    {
      title: "Я скучаю по твоей улыбке",
      body: "Прости, что сорвался, когда злился совсем не на тебя. Задел то, что тебе и так было нелегко."
    },
    {
      title: "Дай мне шанс всё исправить",
      body: "Прости, что не сдержал обещание, которое тебе дал. Пошатнул доверие, которое ты в меня вложила."
    },
    {
      title: "Ты — самое важное, что у меня есть",
      body: "Прости меня, пожалуйста. Обещаю ценить твоё время, твои чувства и тебя саму — каждый день."
    }
  ];

  let stage = 0;
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const stageCount = document.getElementById('stageCount');
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const body = document.body;

  function renderStage(){
    title.classList.remove('fade');
    subtitle.classList.remove('fade');
    void title.offsetWidth; // restart animation
    title.classList.add('fade');
    subtitle.classList.add('fade');

    title.textContent = stages[stage].title;
    subtitle.textContent = stages[stage].body;

    body.classList.remove('stage-2','stage-3','stage-4');
    if(stage === 1) body.classList.add('stage-2');
    if(stage === 2) body.classList.add('stage-3');
    if(stage >= 3) body.classList.add('stage-4');

    stageCount.textContent = stage > 0 ? "Попытка № " + (stage + 1) : "";
  }

  noBtn.addEventListener('click', () => {
    if(stage < stages.length - 1){
      stage++;
    }
    renderStage();
  });

  yesBtn.addEventListener('click', () => {
    body.classList.add('forgiven');
    launchHeartBurst();
  });

  function launchHeartBurst(){
    for(let i = 0; i < 24; i++){
      const h = document.createElement('div');
      h.className = 'burst-heart';
      h.textContent = '❤';
      h.style.left = Math.random() * 100 + 'vw';
      h.style.top = (60 + Math.random() * 30) + 'vh';
      h.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 2200);
    }
  }

  // ambient floating hearts in background
  const heartsWrap = document.getElementById('hearts');
  const glyphs = ['❤','♡'];
  for(let i = 0; i < 14; i++){
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random()*14) + 'px';
    h.style.animationDuration = (10 + Math.random()*10) + 's';
    h.style.animationDelay = (Math.random()*10) + 's';
    heartsWrap.appendChild(h);
  }
</script>

</body>
